<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01//EN" 
"http://www.w3.org/TR/html4/strict.dtd">
<html>
    <head>        
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <meta name="code" content="Кодировка: utf-8">
        <title>CSS</title> 
         <style type="text/css">
        .b {
            position: relative;
            width: 800px;
            height: 550px;
            background-color: #bfbfbf;
            border: 1px solid #000;
            margin: 20px auto;
        }

        .box {
            position: absolute;
            border: 1px solid #000;
        }

        .rb {
            top: 40px;
            left: 40px;
            width: 300px;
            height: 110px;
            background-color: red;
        }

        .yb {
            top: 240px;
            left: 230px;
            width: 300px;
            height: 100px;
            background-color: yellow;
        }

        .gb{
            bottom: 40px;
            right: 40px;
            width: 300px;
            height: 100px;
            background-color: green;
        }
         .wb {
            top: 40px;
            left: 40px;
            width: 300px;
            height: 110px;
            margin-left: 750px;
            background-color: white;
        }

         .bb {
            top: 40px;
            left: 40px;
            width: 300px;
            height: 110px;
            margin-left: 750px;
            background-color: blue;
        }

        .rb2 {
            top: 40px;
            left: 40px;
            width: 300px;
            height: 110px;
            margin-left: 750px;
            background-color: red;
        }
       body {
            background-color: rgb(206, 206, 206);
       }
    </style>
    </head>
    <body>
            <div class="b">
            <div class="box rb"></div>
            <div class="box yb"></div>
            <div class="box gb"></div>
        </div>
        <div>
            <div class="wb"></div>
            <div class="bb"></div>
            <div class="rb2"></div>
        </div>
         <p>
    <a href="https://validator.w3.org/check?uri=referer"><img
      src="https://www.w3.org/Icons/valid-html401" alt="Valid HTML 4.01 Strict" height="31" width="88"></a>
  </p>
    </body>
</html>
